name: Orders by Category (Stacked Bar)
entity_id: ciG63nSLHKRTImt5iWEte
collection_id: cOlViZsEtTiNgS0ExAmP1
creator_id: admin@example.com
display: bar
database_id: Sample Database
dataset_query:
  "lib/type": mbql/query
  database: Sample Database
  stages:
  - "lib/type": mbql.stage/mbql
    source-table:
    - Sample Database
    - null
    - ORDERS
    aggregation:
    - - count
      - {}
    breakout:
    - - field
      - temporal-unit: quarter
      - - Sample Database
        - null
        - ORDERS
        - CREATED_AT
    joins:
    - stages:
      - "lib/type": mbql.stage/mbql
        source-table:
        - Sample Database
        - null
        - PRODUCTS
      conditions:
      - - =
        - {}
        - - field
          - {}
          - - Sample Database
            - null
            - ORDERS
            - PRODUCT_ID
        - - field
          - {}
          - - Sample Database
            - null
            - PRODUCTS
            - ID
      alias: Products
      strategy: left-join
      fields: all
visualization_settings:
  "graph.show_values": true
  "graph.show_stack_values": total
  "graph.x_axis.title_text": Quarter
  "graph.y_axis.title_text": Order Count
  "graph.dimensions":
  - CREATED_AT
  - CATEGORY
  "graph.metrics":
  - count
  "stackable.stack_type": stacked
  "graph.max_categories_enabled": true
  "graph.max_categories": 4
  "graph.other_category_aggregation_fn": sum
serdes/meta:
- id: ciG63nSLHKRTImt5iWEte
  label: bar_chart_stacked
  model: Card
