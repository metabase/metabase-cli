name: Product Revenue Report
entity_id: 7JwIkkAG-06-nsl4jzsaq
creator_id: admin@example.com
source_database_id: Sample Database
source:
  type: query
  query:
    "lib/type": mbql/query
    database: Sample Database
    stages:
      - "lib/type": mbql.stage/native
        native: |-
          SELECT
            p.CATEGORY,
            COUNT(DISTINCT o.ID) AS order_count,
            SUM(o.TOTAL) AS total_revenue,
            AVG(o.TOTAL) AS avg_order_value
          FROM ORDERS o
          JOIN PRODUCTS p ON o.PRODUCT_ID = p.ID
          GROUP BY p.CATEGORY
target:
  database: Sample Database
  type: table
  schema: TRANSFORMS
  name: product_revenue_report
serdes/meta:
- id: 7JwIkkAG-06-nsl4jzsaq
  label: product_revenue_report
  model: Transform
