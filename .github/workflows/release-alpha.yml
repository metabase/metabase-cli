name: Publish Alpha from Branch

on:
  pull_request:
    types: [labeled]

jobs:
  publish-alpha:
    if: github.event.label.name == 'publish-alpha' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # The branch name is attacker-shaped text: git refs may contain `$`, `(`, `;` and backticks.
      # Pass it through env so the shell sees it as data, never as script.
      - name: Compute alpha version and dist-tag
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          BASE=$(node -p "require('./packages/cli/package.json').version")
          SLUG=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//')
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${BASE}-alpha.${SLUG}.${SHORT_SHA}"
          TAG="alpha-${SLUG}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Will publish @metabase/cli@$VERSION with dist-tag $TAG"

      - name: Set package version
        working-directory: packages/cli
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Build
        run: bun run build

      # `npm publish` would run this script itself, with NODE_AUTH_TOKEN in the environment. Run it
      # here without the token instead, so the publish step below can pass --ignore-scripts. It
      # rebuilds dist/ with tsdown and checks it, exactly as the publish-time hook did.
      - name: Run prepublish checks
        working-directory: packages/cli
        run: npm run prepublishOnly

      # The only step that sees the npm token. --ignore-scripts keeps package lifecycle scripts from
      # the PR branch from running with it; the tarball is packed from the dist/ built above.
      - name: Publish to NPM
        working-directory: packages/cli
        run: npm publish --ignore-scripts --tag "$TAG" --access public
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RELEASE_TOKEN }}

      - name: Remove label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            -X DELETE \
            "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/publish-alpha" \
            || true

      - name: Comment on PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          BODY=$(printf 'Published `@metabase/cli@%s` with dist-tag `%s`.\n\nInstall: `npm install -g @metabase/cli@%s`' "$VERSION" "$TAG" "$TAG")
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Generate workflow summary
        if: always()
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          {
            printf '## @metabase/cli alpha publish\n\n'
            printf -- '- **Branch**: %s\n' "$HEAD_REF"
            printf -- '- **Version**: %s\n' "$VERSION"
            printf -- '- **Dist-tag**: %s\n' "$TAG"
            printf -- '- **Install**: `npm install @metabase/cli@%s`\n' "$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
